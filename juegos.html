<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Libertify Games</title>

  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #00bfa6;
      --accent-dark: #009e8a;
      --text: #eaeaea;
      --muted: #b0b0b0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #1b1b1b, #0e0e0e);
      color: var(--text);
    }

    /* ===== BANNER ===== */
    .banner {
      max-width: 1300px;
      margin: 40px auto 20px;
      padding: 0 20px;
    }

    .banner img {
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0,0,0,.6);
    }

    /* ===== CONTENIDO ===== */
    main {
      max-width: 1300px;
      margin: auto;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .game {
      background: linear-gradient(180deg, #222, #171717);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,.35);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .game:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 40px rgba(0,0,0,.55);
    }

    .game img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-grow: 1;
    }

    .info h2 {
      font-size: 1.05rem;
      margin: 0;
    }

    .info p {
      font-size: .9rem;
      color: var(--muted);
      margin: 0;
      flex-grow: 1;
    }

    /* ===== BOTÓN MEJORADO ===== */
    .button {
      margin-top: 8px;
      text-align: center;
      padding: 11px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: .3px;
      color: var(--text);
      background: linear-gradient(
        135deg,
        var(--accent-dark),
        #006f63
      );
      border: 1px solid rgba(255,255,255,.08);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 6px 15px rgba(0,0,0,.5);
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .button:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        0 10px 25px rgba(0,0,0,.7);
    }

    .button:active {
      transform: translateY(1px);
      box-shadow:
        inset 0 3px 6px rgba(0,0,0,.6);
    }

    footer {
      text-align: center;
      padding: 30px 10px;
      font-size: .8rem;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="banner">
    <img src="https://i.imgur.com/RxLWZSI.png" alt="Libertify Games">
  </div>

  <main>
    <div class="grid" id="games"></div>
  </main>

  <footer>
    Libertify Games — no se almacena ningún archivo en la página
  </footer>

  <script>
    const juegos = [
      {
        titulo: "Ultimate Chicken Horse [ONLINE Y SIN MODS]",
        descripcion: "Juego de fiestas online o local para arruinar amistades con plataformas.",
        imagen: "https://assets.nintendo.com/image/upload/c_fill,w_1200/q_auto:best/f_auto/dpr_2.0/ncom/software/switch/70010000002401/0beb41e342fc129c51b54cd9075c212ed208bdce61a15ac54dd7dc7e3426e118",
        enlace: "https://www.mediafire.com/file/f9jzdqvy08dzf9n/Ultimate+Chicken+Horse.exe/file"
      },
      {
        titulo: "Hollow Knight: Silksong [NO ONLINE]",
        descripcion: "Explora un reino embrujado, lucha y sobrevive.",
        imagen: "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1030300/7983574d464e6559ac7e24275727f73a8bcca1f3/header.jpg",
        enlace: "https://gofile.io/d/vGCMG2"
      },
      {
        titulo: "Stardew Valley [NO ONLINE]",
        descripcion: "Relaja, cultiva y vive tu vida granjera.",
        imagen: "https://image.api.playstation.com/cdn/UP2456/CUSA06840_00/0WuZecPtRr7aEsQPv2nJqiPa2ZvDOpYm.png",
        enlace: "https://www.mediafire.com/file/srcufq8wau7ju8q/Stardew+Valley.exe/file"
      },
      {
        titulo: "Castle Crashers [LOCAL]",
        descripcion: "Acción caótica con caballeros y mucho golpe.",
        imagen: "https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/204360/header.jpg",
        enlace: "https://www.mediafire.com/file/mnlsmj7do72da9q/Castle+Crashers.exe/file"
      },
      {
        titulo: "Balatro [ONLINE Y MODS]",
        descripcion: "No es un juego de cartas. Es una adicción.",
        imagen: "https://i0.wp.com/nerfeados.com/wp-content/uploads/2024/03/Balatro_Portada.jpg",
        enlace: "https://www.mediafire.com/file/lud04z3ub7txboh/Balatro.exe/file"
      },
      {
        titulo: "Among Us [ONLINE]",
        descripcion: "Confía en nadie. Especialmente en rojo.",
        imagen: "https://assets.nintendo.com/image/upload/c_fill,w_1200/q_auto:best/f_auto/dpr_2.0/ncom/software/switch/70010000036098/758ab0b61205081da2466386940752c70e0e5ea43bd39e8b9b13eaa455c69b7e",
        enlace: "https://gofile.io/d/YwsJdS"
      },
      {
        titulo: "Undertale",
        descripcion: "Un RPG donde matar no siempre es la respuesta.",
        imagen: "https://images.hive.blog/1200x630/https://images.hive.blog/DQmaHSzZ5fAG3pzfV4nBErRZBKx92Q4ixDwYF1worjXLW7g/ar4vc.jpeg",
        enlace: "https://www.mediafire.com/file/fvn9dw35ws6itue/Undertale.exe/file"
      },
      {
        titulo: "The Stanley Parable: Ultra Deluxe",
        descripcion: "Obedece al narrador. O no.",
        imagen: "https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1703340/header.jpg",
        enlace: "https://buzzheavier.com/418kfvri5sit"
      }
    ];

    const grid = document.getElementById("games");

    juegos.forEach(j => {
      const card = document.createElement("div");
      card.className = "game";
      card.innerHTML = `
        <img src="${j.imagen}" alt="${j.titulo}">
        <div class="info">
          <h2>${j.titulo}</h2>
          <p>${j.descripcion}</p>
          <a href="${j.enlace}" target="_blank" class="button">Descargar</a>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>

</body>
</html>
