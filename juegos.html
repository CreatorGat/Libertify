<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Libertify Games</title>

  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #00bfa6;
      --accent-dark: #009e8a;
      --text: #eaeaea;
      --muted: #b0b0b0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #1b1b1b, #0e0e0e);
      color: var(--text);
    }

    /* ===== BANNER ===== */
    .banner {
      max-width: 1300px;
      margin: 40px auto 20px;
      padding: 0 20px;
    }

    .banner img {
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0,0,0,.6);
    }

    /* ===== UBLOCK ===== */
    .ublock {
      max-width: 1300px;
      margin: 10px auto 30px;
      padding: 0 20px;
    }

    .ublock-card {
      background: linear-gradient(180deg, #1f1f1f, #151515);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,.4);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ublock-card h3 {
      margin: 0;
      font-size: 1.1rem;
    }

    .ublock-card p {
      margin: 0;
      font-size: .9rem;
      color: var(--muted);
    }

    .ublock-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* ===== BOTÓN ===== */
    .button {
      text-align: center;
      padding: 11px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: .3px;
      color: var(--text);
      background: linear-gradient(135deg, var(--accent-dark), #006f63);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 6px 15px rgba(0,0,0,.5);
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .button:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        0 10px 25px rgba(0,0,0,.7);
    }

    .button:active {
      transform: translateY(1px);
      box-shadow: inset 0 3px 6px rgba(0,0,0,.6);
    }

    /* ===== CONTENIDO ===== */
    main {
      max-width: 1300px;
      margin: auto;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .game {
      background: linear-gradient(180deg, #222, #171717);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,.35);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .game:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 40px rgba(0,0,0,.55);
    }

    .game img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-grow: 1;
    }

    .info h2 {
      font-size: 1.05rem;
      margin: 0;
    }

    .info p {
      font-size: .9rem;
      color: var(--muted);
      margin: 0;
      flex-grow: 1;
    }

    footer {
      text-align: center;
      padding: 30px 10px;
      font-size: .8rem;
      color: #777;
    }
  </style>
</head>

<body>

  <!-- BANNER -->
  <div class="banner">
    <img src="https://i.imgur.com/RxLWZSI.png" alt="Libertify Games">
  </div>

  <!-- RECOMENDACIÓN UBLOCK -->
  <section class="ublock">
    <div class="ublock-card">
      <h3>Recomendado: uBlock Origin</h3>
      <p>
        Para una mejor experiencia (y menos cosas raras volando por la pantalla),
        usa uBlock Origin. Gratis, ligero y no te juzga.
      </p>
      <div class="ublock-buttons">
        <a class="button" target="_blank"
           href="https://addons.mozilla.org/firefox/addon/ublock-origin/">
          Descargar para Firefox
        </a>
        <a class="button" target="_blank"
           href="https://chromewebstore.google.com/detail/ublock-origin/cjpalhdlnbpafiamejdnhcphjbkeiagm">
          Descargar para Chrome
        </a>
      </div>
    </div>
  </section>

  <!-- JUEGOS -->
  <main>
    <div class="grid" id="games"></div>
  </main>

  <footer>
    Libertify Games — no se almacena ningún archivo en la página
  </footer>

    const grid = document.getElementById("games");

    juegos.forEach(j => {
      const card = document.createElement("div");
      card.className = "game";
      card.innerHTML = `
        <img src="${j.imagen}" alt="${j.titulo}">
        <div class="info">
          <h2>${j.titulo}</h2>
          <p>${j.descripcion}</p>

      grid.appendChild(card);

  </script>

</body>
</html>
